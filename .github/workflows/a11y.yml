# true uniquement. Gate d'accessibilité RGAA / WCAG 2 AA via pa11y-ci
# (moteurs htmlcs + axe), sur le build web local, seuil ZÉRO régression.
# Config : .pa11yci (URLs, moteurs, éléments masqués). Chaque page ajoutée au
# site s'ajoute à .pa11yci, dans chaque langue et chaque thème qui change son rendu.
#
# Ce contrôle protège le code ; l'audit RGAA public (Ara) se fait sur le site
# déployé, depuis le dépôt bullify-documentation (cf socle §Ara).
name: A11y (pa11y-ci)

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/ui-tokens/**"
      - ".pa11yci"
      - ".github/workflows/a11y.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/ui/**"
      - "packages/ui-tokens/**"
      - ".pa11yci"
      - ".github/workflows/a11y.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_PUBLIC_SITE_URL: http://localhost:3000

jobs:
  pa11y:
    name: pa11y-ci (WCAG2AA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter @nutrion/web
      # pa11y-ci@4 embarque puppeteer-core@24, qui cherche SON Chrome dans
      # ~/.cache/puppeteer : `playwright install-deps` ne pose que les bibliothèques
      # système, le navigateur s'installe avec le puppeteer de la même majeure.
      - run: pnpm dlx playwright install-deps chromium
      - run: pnpm dlx puppeteer@24 browsers install chrome
      - name: pa11y-ci sur le build local
        run: |
          pnpm dlx start-server-and-test \
            'pnpm --filter @nutrion/web start' 'http-get://localhost:3000/fr' \
            'pnpm dlx pa11y-ci@4'
