name: Deploy preprod

# main → images GHCR (avec SBOM et provenance attachées) → préprod → sonde de santé.
#
# Le déploiement passe par `bullify-deploy` sur la VM (dépôt bullify-infra,
# scripts/deploiement/bullify-deploy) : la clé SSH de CI ne peut lancer que cette
# commande, avec le tag « sha-<hexa> » et une archive tar (identifiants GHCR,
# compose, .env). Le projet, ses images, ses migrations et sa sonde sont fixés côté
# VM dans /etc/bullify-deploy/nutrion-app.conf, dont les migrations :
#   migrer() { compose run --rm --no-deps backend node dist/migrate.js; }
# À poser avec l'infra avant le premier déploiement, comme les secrets SSH_DEPLOY_KEY,
# ENV_PREPROD, NEXT_PUBLIC_SENTRY_DSN, NEXT_PUBLIC_POSTHOG_KEY et SENTRY_AUTH_TOKEN
# (envoi des sourcemaps web), et les variables DEPLOY_HOST, DEPLOY_HOST_KEY (ligne
# known_hosts de la VM), PREPROD_API_URL, SENTRY_ORG et SENTRY_PROJECT_WEB.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un déploiement en vol (migrations comprises) n'est jamais annulé : le suivant attend.
concurrency:
  group: deploy-preprod
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck test

  build-and-push:
    name: Image ${{ matrix.app }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Les secrets de build (DSN, clé PostHog, jeton Sentry) vivent dans l'environnement
    # preprod (skill deploy-runner §3.2) : sans cette ligne, ils arrivent vides.
    environment: preprod
    permissions:
      contents: read
      packages: write
      # Attestations de provenance et de SBOM poussées avec l'image.
      attestations: write
      id-token: write
    strategy:
      matrix:
        # Une entrée par app déployée (true : web).
        app: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: |
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "nom=$REGISTRY/$owner/nutrion-app-${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      # sbom et provenance : BuildKit les génère et les attache à l'image, sans outil
      # de plus (`docker buildx imagetools inspect` les relit).
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.image.outputs.nom }}:sha-${{ github.sha }}
          # RELEASE : release Sentry de chaque image (API, cron, web). Les autres sont
          # figés dans le bundle web au build, sans effet sur l'image backend.
          # NEXT_PUBLIC_APP_ENV : l'image web se construit par environnement.
          build-args: |
            RELEASE=sha-${{ github.sha }}
            NEXT_PUBLIC_APP_ENV=preprod
            NEXT_PUBLIC_API_BASE_URL=${{ vars.PREPROD_API_URL }}
            NEXT_PUBLIC_SITE_URL=https://nutrion-app.preprod.local
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT_WEB }}
          # Jeton d'envoi des sourcemaps web : un secret de build, monté pour la seule
          # commande `next build` (apps/web/Dockerfile), jamais un build-arg, qui resterait
          # lisible dans l'image et dans le cache. Absent : le build passe, sans envoi.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=min,scope=${{ matrix.app }}

  deploy-preprod:
    name: Déploiement préprod
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: preprod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Envoi à bullify-deploy
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          ENV_PREPROD: ${{ secrets.ENV_PREPROD }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_HOST_KEY: ${{ vars.DEPLOY_HOST_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_DEPLOY_KEY" > ~/.ssh/deploiement
          chmod 600 ~/.ssh/deploiement
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          envoi=$(mktemp -d)
          mkdir -p "$envoi/fichiers"
          cp docker-compose.preprod.yml "$envoi/fichiers/"
          printf '%s\n' "$ENV_PREPROD" > "$envoi/fichiers/.env"
          printf '%s %s\n' "$GHCR_USER" "$GHCR_TOKEN" > "$envoi/ghcr"
          tar -C "$envoi" -cf - . | ssh -i ~/.ssh/deploiement -o IdentitiesOnly=yes "deploy@$DEPLOY_HOST" "$TAG"

  smoke-preprod:
    name: Sonde de santé
    needs: deploy-preprod
    runs-on: ubuntu-latest
    steps:
      # PREPROD_API_URL : l'URL publique du backend en préprod, préfixe /v1 compris.
      - name: /health et /health/ready répondent
        env:
          API: ${{ vars.PREPROD_API_URL }}
        run: |
          for chemin in health health/ready; do
            curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "$API/$chemin"
          done
