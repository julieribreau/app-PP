name: Charge

# Tests de charge k6 à la demande (skill load-testing, apps/load-tests) : le smoke, puis le
# scénario choisi, contre l'API construite et démarrée dans le job, sur un PostgreSQL et un
# Redis jetables. Un seuil non tenu fait échouer le job ; le résumé part en artefact.
# Le runner mesure sa propre machine : ce passage détecte une régression d'un commit à
# l'autre, il ne dimensionne pas la production. La préprod se charge depuis le poste, aux
# conditions du skill (§4).

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scénario lancé après le smoke (apps/load-tests/scenarios)"
        type: choice
        options:
          - 01-lecture-publique.js
        default: 01-lecture-publique.js

permissions:
  contents: read

concurrency:
  group: charge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: "nutrion-app"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nutrion-app
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
      - run: pnpm --filter @nutrion/backend build
      - run: pnpm db:migrate
      - name: API en arrière-plan
        env:
          BREVO_API_KEY: non-utilisee
          # Tous les VUs partagent l'adresse du runner : le throttler (100 par minute et par
          # IP) mesurerait le limiteur, pas l'application. Jamais relevé en production.
          THROTTLE_LIMIT: "100000"
        run: |
          BETTER_AUTH_SECRET="$(openssl rand -hex 32)" nohup node apps/backend/dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:3001/v1/health/ready > /dev/null && exit 0
            sleep 1
          done
          echo "::error::API non prête après 60 s"; tail -50 "$RUNNER_TEMP/api.log"; exit 1
      - name: Smoke
        working-directory: apps/load-tests
        run: k6 run scenarios/00-smoke.js
      - name: Charge
        working-directory: apps/load-tests
        env:
          SCENARIO: ${{ inputs.scenario }}
        run: |
          mkdir -p output
          K6_RUN_ID="$GITHUB_RUN_ID" k6 run --summary-export="output/resume-$GITHUB_RUN_ID.json" "scenarios/$SCENARIO"
      - if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: charge-k6
          path: apps/load-tests/output
          retention-days: 30
      - name: Journal de l'API (diagnostic)
        if: ${{ failure() }}
        run: tail -200 "$RUNNER_TEMP/api.log" || true
