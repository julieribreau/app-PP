name: Securite des dependances

# OSV-Scanner et l'audit du registre, sur chaque PR et chaque nuit. Pas sur main :
# une faille publiee entre deux nuits ne doit pas rougir main, la nuit la corrige.
#
# Pas de Dependabot chez Bullify : ce workflow est la seule detection de CVE du
# projet, d'ou l'absence de condition sur les chemins.
#
# Toute vulnerabilite connue bloque, quelle que soit sa gravite : aucune faille
# connue n'est toleree (decision du 2026-09-23). Une exception de
# osv-scanner.toml ne tient que tant qu'aucun correctif n'est publie : voir
# l'en-tete de scripts/check-osv.mjs.
#
# A chaque passage de nuit, le rapport complet part a Bullify Ticketing (job
# `ticketing`) : chaque faille devient un ticket que le worker corrige (montee
# de dependance ou exception datee), et sa PR se fusionne seule une fois verte.

on:
  pull_request:
  schedule:
    - cron: "3 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securite-deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    name: OSV-Scanner (CVE chaine d approvisionnement)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Seuil, exceptions et resolution Python : en-tete de scripts/check-osv.mjs.
      - name: Scan des lockfiles
        run: node scripts/check-osv.mjs --rapport rapport-osv.json pnpm-lock.yaml

      - name: Rapport OSV
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rapport-osv
          path: rapport-osv.json
          if-no-files-found: ignore
          retention-days: 7

  audit:
    name: Audit du registre
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      # Lit le lockfile, n'installe rien. Toute gravite bloque ; les exceptions de
      # osv-scanner.toml s'appliquent, avec la meme regle (scripts/check-audit.mjs).
      - name: Vulnerabilites connues (bloquant, toute gravite)
        run: node scripts/check-audit.mjs --rapport rapport-audit.json .

      - name: Rapport de l'audit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rapport-audit
          path: rapport-audit.json
          if-no-files-found: ignore
          retention-days: 7

  ticketing:
    name: Rapport a Bullify Ticketing
    needs: [osv, audit]
    # Sur main seulement : le rapport decrit l'etat de main, et Ticketing clot ce
    # qu'il ne contient plus. Il ne part que si les deux controles ont rendu le
    # leur, vert ou rouge : un controle qui a plante n'envoie rien.
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        continue-on-error: true
        with:
          pattern: rapport-*
          merge-multiple: true
          path: rapports

      - name: Envoi du rapport
        env:
          SECURITE_WEBHOOK_SECRET: ${{ secrets.SECURITE_WEBHOOK_SECRET }}
        run: |
          if [ ! -f rapports/rapport-osv.json ] || [ ! -f rapports/rapport-audit.json ]; then
            echo "::error::rapport incomplet : un controle a plante, rien n'est envoye a Ticketing."
            exit 1
          fi
          node scripts/notify-ticketing.mjs rapports/rapport-osv.json rapports/rapport-audit.json
