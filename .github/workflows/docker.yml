# CI/CD courte : contrôle, images Docker sur GHCR, déploiement si un hôte est déclaré.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency: { group: "docker-${{ github.ref }}", cancel-in-progress: true }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test

  images:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [backend, web] }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env: { APP: "${{ matrix.app }}" }
        run: |
          img="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nutrion-$APP"
          tags="$img:sha-${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags,$img:latest"; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags="$tags,$img:$GITHUB_REF_NAME"; fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RELEASE=sha-${{ github.sha }}
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL || 'http://localhost:3000' }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.POSTHOG_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  # Ne tourne que si la variable DEPLOY_HOST (user@hôte) est définie dans le dépôt.
  deploy:
    needs: images
    if: vars.DEPLOY_HOST != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: docker compose pull && up -d sur l'hôte
        env:
          KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          HOST: ${{ vars.DEPLOY_HOST }}
          DIR: ${{ vars.DEPLOY_DIR || '/opt/nutrion' }}
        run: |
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          ssh -i ~/key -o StrictHostKeyChecking=accept-new "$HOST" \
            "cd $DIR && docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d --remove-orphans"
