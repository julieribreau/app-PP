# Inscription : erreurs du formulaire, message de vérification, connexion refusée avant
# confirmation, lien lu dans Mailpit et ouvert (page du site), puis connexion.
appId: io.bullify.nutrion-app
name: Inscription
---
- runFlow: subflows/launch-accepted.yaml
- evalScript: ${output.email = 'qa-e2e+signup-' + Date.now() + '@exemple.test'}
- evalScript: ${output.password = 'Qa-Signup-' + Date.now()}
- tapOn:
    id: tab-account
- tapOn:
    id: account-sign-up
# Formulaire vide : chaque champ obligatoire le dit, les CGU aussi.
- runFlow: { file: subflows/tap-low.yaml, env: { ID: sign-up-submit } }
- assertVisible: "Accept the terms to continue."
- assertVisible: "This field is required."
# Saisie enchaînée par « Suivant » ; mot de passe trop court refusé.
- scrollUntilVisible:
    element:
      id: sign-up-first-name
    direction: UP
- tapOn:
    id: sign-up-first-name
- inputText: "Alex"
- pressKey: Enter
- inputText: "Durand"
- pressKey: Enter
- inputText: ${output.email}
- pressKey: Enter
- inputText: "court1"
- pressKey: Enter
- runFlow: { file: subflows/tap-low.yaml, env: { ID: sign-up-terms } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: sign-up-submit } }
- assertVisible: "At least 12 characters, including a digit."
- tapOn:
    id: sign-up-password
- eraseText: 20
- inputText: ${output.password}
- pressKey: Enter
- runFlow: { file: subflows/tap-low.yaml, env: { ID: sign-up-submit } }
- runFlow: subflows/after-sign-in.yaml
- extendedWaitUntil:
    visible: "Check your inbox"
    timeout: 15000
- assertVisible: "A confirmation email was sent to ${output.email}."
# Pas encore confirmé : connexion refusée.
- tapOn:
    id: sign-up-back-to-sign-in
- runFlow:
    file: subflows/fill-sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- extendedWaitUntil:
    visible: "Please confirm your email address before signing in."
    timeout: 15000
# L'e-mail est en anglais, la langue de l'app (il partait en français).
- runScript:
    file: scripts/mail-link.js
    env:
      EMAIL: ${output.email}
- assertTrue: ${output.subject == "Confirm your email address"}
- openLink: ${output.link}
- extendedWaitUntil:
    visible: ".*Email confirmed. You can now sign in.*"
    timeout: 30000
# Retour à l'app, sans la relancer (la feuille ouverte reste là).
- launchApp:
    stopApp: false
- runFlow:
    file: subflows/fill-sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- runFlow: subflows/after-sign-in.yaml
- tapOn:
    id: tab-account
- extendedWaitUntil:
    visible:
      id: account-profile-card
    timeout: 20000
- assertVisible: ".*Alex Durand.*"
