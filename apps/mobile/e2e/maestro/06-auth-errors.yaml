# Erreurs de connexion, mot de passe oublié (e-mail reçu, lien vers le site) et verrouillage
# après 5 échecs (compte jetable, pour ne pas verrouiller Camille).
appId: io.bullify.nutrion-app
name: Erreurs de connexion et verrouillage
---
- runFlow: subflows/launch-accepted.yaml
- tapOn:
    id: tab-account
    retryTapIfNoChange: true
- tapOn:
    id: account-sign-in
# E-mail mal formé, puis mot de passe manquant : contrôlés avant tout appel.
- runFlow:
    file: subflows/fill-sign-in.yaml
    env:
      EMAIL: "camille@"
      PASSWORD: "x"
- assertVisible: "Invalid email address."
- tapOn:
    id: sign-in-email
- eraseText: 60
- inputText: "camille.martin@exemple.fr"
- pressKey: Enter
- eraseText: 10
- pressKey: Enter
- assertVisible: "This field is required."
# Mauvais mot de passe.
- runFlow:
    file: subflows/fill-sign-in.yaml
    env:
      EMAIL: "camille.martin@exemple.fr"
      PASSWORD: "Mauvais-Mot-2026"
- extendedWaitUntil:
    visible: "Incorrect email or password."
    timeout: 15000
# Mot de passe oublié : même message que le compte existe ou non, e-mail parti.
- tapOn:
    id: sign-in-forgot
- runFlow: { file: subflows/field.yaml, env: { ID: forgot-email, TEXT: camille.martin@exemple.fr } }
- tapOn:
    id: forgot-submit
- extendedWaitUntil:
    visible: "If an account exists for this address, a link is on its way."
    timeout: 15000
- runScript:
    file: scripts/mail-link.js
    env:
      EMAIL: camille.martin@exemple.fr
- assertTrue: ${output.link.indexOf("reset-password") > -1 || output.link.indexOf("reinitialiser") > -1}
- openLink: ${output.link}
- extendedWaitUntil:
    visible: ".*(New password|Nouveau mot de passe).*"
    timeout: 30000
# Retour à l'app, sans la relancer (la feuille ouverte reste là).
- launchApp:
    stopApp: false
- tapOn:
    id: forgot-back
# Verrouillage : 5 échecs d'affilée, puis même le bon mot de passe est refusé 15 minutes.
- runScript:
    file: scripts/account.js
    env:
      PREFIX: lock
- repeat:
    times: 5
    commands:
      - runFlow:
          file: subflows/fill-sign-in.yaml
          env:
            EMAIL: ${output.email}
            PASSWORD: "Mauvais-Mot-2026"
      # Le bouton reste inactif pendant l'appel : on attend la réponse avant le suivant.
      - extendedWaitUntil:
          visible: "Incorrect email or password.|Too many attempts: account locked for 15 minutes."
          timeout: 15000
      - extendedWaitUntil:
          visible:
            id: sign-in-submit
            enabled: true
          timeout: 15000
- runFlow:
    file: subflows/fill-sign-in.yaml
    env:
      EMAIL: ${output.email}
      PASSWORD: ${output.password}
- extendedWaitUntil:
    visible: "Too many attempts: account locked for 15 minutes."
    timeout: 15000
