# Connexion de Camille avec un panier invité : fusion dans son panier, langue du profil (fr)
# appliquée à l'app.
appId: io.bullify.nutrion-app
name: Connexion et fusion du panier invité
---
- runFlow: subflows/launch-accepted.yaml
- runFlow: { file: subflows/tap-low.yaml, env: { ID: product-granola-fruits-rouges } }
- tapOn:
    id: add-to-cart
- extendedWaitUntil:
    visible: "View cart"
    timeout: 10000
- tapOn:
    id: product-back
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: camille.martin@exemple.fr
      PASSWORD: Nutrion-Demo-2026
# Profil de Camille en français : l'app passe en français.
- assertVisible: ".*Camille Martin.*"
- assertVisible: "Compte"
- tapOn:
    id: tab-cart
    retryTapIfNoChange: true
- assertVisible: "Votre panier invité a été ajouté à votre compte."
- assertVisible: "Granola fruits rouges"
- assertVisible: "Avoine & cacao"
- assertNotVisible: ".*Connectez-vous.*"
# Le panier fusionné vit sur le compte : il revient après fermeture de l'app.
- stopApp
- launchApp
- tapOn:
    id: tab-cart
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: "Granola fruits rouges"
    timeout: 15000
