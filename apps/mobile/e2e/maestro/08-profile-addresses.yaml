# Compte de Camille : profil modifié et conservé, photo de profil, adresses (ajout, défaut,
# suppression). Remet tout comme le seed à la fin.
appId: io.bullify.nutrion-app
name: Profil, photo et adresses
---
- runFlow: subflows/sign-in-camille.yaml
# Profil : prénom et téléphone modifiés, conservés après relancement.
- tapOn:
    id: account-profile
- runFlow: { file: subflows/field.yaml, env: { ID: profile-first-name, TEXT: "Camille-QA" } }
- runFlow: { file: subflows/field-pad.yaml, env: { ID: profile-phone, TEXT: "0700000000" } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: profile-save } }
- scrollUntilVisible:
    element: "Profil enregistré."
    direction: UP
    timeout: 15000
- stopApp
- launchApp
- tapOn:
    id: tab-account
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible: ".*Camille-QA Martin.*"
    timeout: 20000
- tapOn:
    id: account-profile
- assertVisible:
    id: profile-first-name
    text: "Camille-QA"
- assertVisible:
    id: profile-phone
    text: "0700000000"
# Photo de profil : une image de la photothèque (ajoutée par le script avec simctl addmedia).
- runFlow: { file: subflows/tap-low.yaml, env: { ID: profile-change-photo } }
# Le sélecteur de photos et l'écran de recadrage d'iOS tournent hors de l'app (invisibles dans
# la hiérarchie) : premier carré (la photo ajoutée par simctl addmedia), puis « Choisir ».
- extendedWaitUntil:
    visible: "attente du sélecteur"
    timeout: 4000
    optional: true
- tapOn:
    id: PXGGridLayout-Info
    index: 0
- extendedWaitUntil:
    visible: "attente du recadrage"
    timeout: 3000
    optional: true
- tapOn:
    id: Done
- extendedWaitUntil:
    visible:
      id: profile-remove-photo
    timeout: 30000
- runFlow: { file: subflows/tap-low.yaml, env: { ID: profile-remove-photo } }
- extendedWaitUntil:
    notVisible:
      id: profile-remove-photo
    timeout: 15000
# Remise du profil du seed.
- runFlow: { file: subflows/field.yaml, env: { ID: profile-first-name, TEXT: "Camille" } }
- runFlow: { file: subflows/field-pad.yaml, env: { ID: profile-phone, TEXT: "06 12 34 56 78" } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: profile-save } }
- scrollUntilVisible:
    element: "Profil enregistré."
    direction: UP
    timeout: 15000
- tapOn:
    id: BackButton
# Adresses : Maison (par défaut) et Bureau du seed, puis une nouvelle.
- tapOn:
    id: account-addresses
- assertVisible: "Maison"
- assertVisible: "Bureau"
# Adresse par défaut en tête de liste.
- assertVisible:
    text: "Maison"
    above: "Bureau"
- tapOn:
    id: address-add
# Champs obligatoires contrôlés.
- runFlow: { file: subflows/tap-low.yaml, env: { ID: address-save } }
- assertVisible: "Ce champ est obligatoire."
- runFlow: { file: subflows/field.yaml, env: { ID: address-label, TEXT: "Atelier QA" } }
- runFlow: { file: subflows/field.yaml, env: { ID: address-recipient, TEXT: "Camille Martin" } }
- runFlow: { file: subflows/field.yaml, env: { ID: address-line1, TEXT: "5 rue de l'Essai" } }
- runFlow: { file: subflows/field-pad.yaml, env: { ID: address-postal-code, TEXT: "75011" } }
- runFlow: { file: subflows/field.yaml, env: { ID: address-city, TEXT: "Paris" } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: address-save } }
- extendedWaitUntil:
    visible: "Atelier QA"
    timeout: 15000
# Le lien de la carte « Atelier QA » : le premier sous son nom.
- tapOn:
    id: "address-\\d-default"
    below: "Atelier QA"
- extendedWaitUntil:
    visible:
      text: "Atelier QA"
      above: "Maison"
    timeout: 15000
- stopApp
- launchApp
- tapOn:
    id: tab-account
    retryTapIfNoChange: true
- tapOn:
    id: account-addresses
- extendedWaitUntil:
    visible:
      text: "Atelier QA"
      above: "Maison"
    timeout: 15000
# Maison redevient l'adresse par défaut, Atelier QA est supprimée.
# Le lien de la carte « Maison » : le premier sous son nom.
- tapOn:
    id: "address-\\d-default"
    below: "Maison"
- extendedWaitUntil:
    visible:
      text: "Maison"
      above: "Atelier QA"
    timeout: 15000
# Le lien de la carte « Atelier QA » : le premier sous son nom.
- tapOn:
    id: "address-\\d-delete"
    below: "Atelier QA"
- assertVisible: "Supprimer cette adresse ?"
- tapOn:
    text: "Supprimer"
    index: 0
    below: "Supprimer cette adresse ?"
- extendedWaitUntil:
    notVisible: "Atelier QA"
    timeout: 15000
- assertVisible: "Bureau"
