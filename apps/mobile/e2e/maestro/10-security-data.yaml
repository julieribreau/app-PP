# Compte jetable : appareils connectés (révoquer une autre session), mot de passe, export de
# données (feuille de partage), suppression du compte, déconnexion.
appId: io.bullify.nutrion-app
name: Sécurité et données
---
- runScript:
    file: scripts/account.js
    env:
      PREFIX: secu
- evalScript: ${output.account = output.email; output.secret = output.password}
- runFlow: subflows/launch-accepted.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.account}
      PASSWORD: ${output.secret}
# Une autre session, ouverte depuis « Windows », révoquée depuis l'app.
- runScript:
    file: scripts/other-session.js
    env:
      EMAIL: ${output.account}
      PASSWORD: ${output.secret}
- runScript:
    file: scripts/session-alive.js
    env:
      COOKIE: ${output.cookie}
- assertTrue: ${output.alive == "true"}
- tapOn:
    id: account-devices
- extendedWaitUntil:
    visible: "Windows"
    timeout: 15000
- assertVisible:
    id: session-current
# Le lien de confirmation suivi par le script a ouvert une session lui aussi : on révoque les
# autres sessions une à une jusqu'à celle de « Windows ».
- repeat:
    while:
      visible: "Windows"
    times: 4
    commands:
      - tapOn:
          id: session-revoke
      - waitForAnimationToEnd
- extendedWaitUntil:
    notVisible: "Windows"
    timeout: 15000
- runScript:
    file: scripts/session-alive.js
    env:
      COOKIE: ${output.cookie}
- assertTrue: ${output.alive == "false"}
# Mot de passe : trop faible refusé, mauvais mot de passe actuel refusé, puis changé.
- runFlow:
    { file: subflows/field.yaml, env: { ID: security-current-password, TEXT: "${output.secret}" } }
- runFlow: { file: subflows/field.yaml, env: { ID: security-new-password, TEXT: "court1" } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: security-change-password } }
- assertVisible: "At least 12 characters, including a digit."
- evalScript: ${output.newSecret = output.secret + "-New9"}
- runFlow:
    { file: subflows/field.yaml, env: { ID: security-new-password, TEXT: "${output.newSecret}" } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: security-change-password } }
- scrollUntilVisible:
    element: "Password changed."
    direction: UP
    timeout: 15000
- tapOn:
    id: BackButton
- runFlow: { file: subflows/tap-low.yaml, env: { ID: account-sign-out } }
- extendedWaitUntil:
    visible:
      id: account-sign-in
    timeout: 15000
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: ${output.account}
      PASSWORD: ${output.newSecret}
# Export : l'archive part dans la feuille de partage du système.
- runFlow: { file: subflows/tap-low.yaml, env: { ID: account-data } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: data-export } }
- extendedWaitUntil:
    visible: ".*(Save to Files|Enregistrer dans Fichiers|AirDrop|Copy|Copier).*"
    timeout: 30000
- takeScreenshot: share-sheet
- runFlow:
    when:
      visible: "Close|Fermer"
    commands:
      - tapOn: "Close|Fermer"
- runFlow:
    when:
      visible: ".*(Save to Files|AirDrop).*"
    commands:
      - swipe:
          direction: DOWN
- extendedWaitUntil:
    visible: "Your export is ready."
    timeout: 15000
# Suppression : le mot à saisir active le bouton ; le compte n'ouvre plus de session ensuite.
- assertVisible:
    id: data-delete
    enabled: false
- runFlow: { file: subflows/field.yaml, env: { ID: data-delete-confirm, TEXT: "DELETE" } }
- runFlow: { file: subflows/tap-low.yaml, env: { ID: data-delete } }
- extendedWaitUntil:
    visible:
      id: account-sign-in
    timeout: 20000
- assertVisible: "Your account has been deleted."
- tapOn: "OK"
- tapOn:
    id: account-sign-in
- runFlow:
    file: subflows/fill-sign-in.yaml
    env:
      EMAIL: ${output.account}
      PASSWORD: ${output.newSecret}
- extendedWaitUntil:
    visible: "Incorrect email or password."
    timeout: 15000
