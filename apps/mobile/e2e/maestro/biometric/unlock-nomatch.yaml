# Face ID (3/3) : visage non reconnu (notifyutil … pearl.nomatch) : l'app reste verrouillée sur
# « Bon retour, Camille » ; le mot de passe la déverrouille.
appId: io.bullify.nutrion-app
name: Face ID — échec puis mot de passe
---
- stopApp
- launchApp
# iOS propose de réessayer : on annule, l'app reste verrouillée.
- extendedWaitUntil:
    visible: ".*(Not Recognized|non reconnu|Try Face ID Again|Réessayer Face ID).*"
    timeout: 30000
- tapOn: "Cancel|Annuler"
- extendedWaitUntil:
    visible:
      id: biometric-unlock
    timeout: 10000
- assertVisible: "Bon retour, Camille|Welcome back, Camille"
- assertVisible:
    id: biometric-unlock
- runFlow:
    file: ../subflows/fill-sign-in.yaml
    env:
      EMAIL: camille.martin@exemple.fr
      PASSWORD: Nutrion-Demo-2026
- extendedWaitUntil:
    notVisible:
      id: biometric-unlock
    timeout: 20000
- runFlow: ../subflows/after-sign-in.yaml
- tapOn:
    id: tab-account
- runFlow: ../subflows/dismiss-save-password.yaml
