# Une passe de captures dans une langue et un thème (LOCALE, THEME), écran par écran. La
# navigation passe par les liens nutrion:// : les mêmes captures sur tous les simulateurs, sans
# dépendre de la position des onglets.
appId: io.bullify.nutrion-app
---
- runFlow: launch-accepted.yaml
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/preferences" } }
- tapOn:
    id: locale-${LOCALE}
- tapOn:
    id: theme-${THEME}
# Déconnecté.
- runFlow: { file: go.yaml, env: { URL: "nutrion:///" } }
- extendedWaitUntil:
    visible:
      id: product-avoine-cacao
    timeout: 20000
- runFlow: { file: screenshot.yaml, env: { NAME: 01-shop } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://product/avoine-cacao" } }
- extendedWaitUntil:
    visible:
      id: add-to-cart
    timeout: 20000
- runFlow: { file: screenshot.yaml, env: { NAME: 02-product } }
- tapOn:
    id: add-to-cart
- extendedWaitUntil:
    visible:
      id: add-to-cart
      enabled: true
    timeout: 15000
- runFlow: { file: go.yaml, env: { URL: "nutrion://product/recuperation-cacao" } }
- extendedWaitUntil:
    visible:
      id: add-to-cart
    timeout: 20000
- runFlow: { file: screenshot.yaml, env: { NAME: 03-product-out-of-stock } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://cart" } }
- extendedWaitUntil:
    visible:
      id: cart-total
    timeout: 20000
- runFlow: { file: screenshot.yaml, env: { NAME: 04-cart-guest } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account" } }
- runFlow: { file: screenshot.yaml, env: { NAME: 05-account-signed-out } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://privacy" } }
- runFlow: { file: screenshot.yaml, env: { NAME: 06-privacy } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://auth/sign-up" } }
- extendedWaitUntil:
    visible:
      id: sign-up-submit
    timeout: 15000
- runFlow: { file: tap-low.yaml, env: { ID: sign-up-submit } }
- runFlow: { file: screenshot.yaml, env: { NAME: 07-sign-up-errors } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://auth/forgot-password" } }
- extendedWaitUntil:
    visible:
      id: forgot-submit
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 08-forgot-password } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://auth/sign-in" } }
- extendedWaitUntil:
    visible:
      id: sign-in-submit
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 09-sign-in } }
# Connectée : Camille (sa langue et son thème s'appliquent, puis on remet ceux de la passe).
- runFlow:
    file: fill-sign-in.yaml
    env:
      EMAIL: camille.martin@exemple.fr
      PASSWORD: Nutrion-Demo-2026
- repeat:
    while:
      visible:
        id: sign-in-submit
    times: 10
    commands:
      - runFlow: after-sign-in.yaml
      - extendedWaitUntil:
          notVisible:
            id: sign-in-submit
          timeout: 2000
          optional: true
- runFlow: after-sign-in.yaml
- runFlow: { file: go.yaml, env: { URL: "nutrion://account" } }
- extendedWaitUntil:
    visible:
      id: account-profile-card
    timeout: 20000
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/preferences" } }
- tapOn:
    id: locale-${LOCALE}
- tapOn:
    id: theme-${THEME}
- runFlow: { file: go.yaml, env: { URL: "nutrion://account" } }
- extendedWaitUntil:
    visible:
      id: account-profile-card
    timeout: 20000
- runFlow: { file: screenshot.yaml, env: { NAME: 10-account } }
- scrollUntilVisible:
    element:
      id: account-sign-out
    direction: DOWN
    centerElement: true
- runFlow: { file: screenshot.yaml, env: { NAME: 11-account-bottom } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://cart" } }
- extendedWaitUntil:
    visible:
      id: cart-total
    timeout: 20000
- runFlow: { file: screenshot.yaml, env: { NAME: 12-cart-merged } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/profile" } }
- extendedWaitUntil:
    visible:
      id: profile-save
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 13-profile } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/addresses" } }
- extendedWaitUntil:
    visible:
      id: address-add
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 14-addresses } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/address/new" } }
- extendedWaitUntil:
    visible:
      id: address-save
    timeout: 15000
- runFlow: { file: tap-low.yaml, env: { ID: address-save } }
- runFlow: { file: screenshot.yaml, env: { NAME: 15-address-form-errors } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/preferences" } }
- extendedWaitUntil:
    visible:
      id: theme-system
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 16-preferences } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/security" } }
- extendedWaitUntil:
    visible:
      id: security-change-password
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 17-security } }
- runFlow: { file: go.yaml, env: { URL: "nutrion://account/data" } }
- extendedWaitUntil:
    visible:
      id: data-export
    timeout: 15000
- runFlow: { file: screenshot.yaml, env: { NAME: 18-data } }
