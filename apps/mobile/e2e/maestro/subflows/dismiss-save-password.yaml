# Sur l'écran Compte après une connexion : la proposition « Enregistrer le mot de passe ? »
# d'iOS est une interface distante, absente de la hiérarchie, qui masque l'app. Si la carte de
# profil reste invisible, on touche « Plus tard » à sa place (coordonnées d'un iPhone standard).
appId: io.bullify.nutrion-app
---
- runFlow: after-sign-in.yaml
- extendedWaitUntil:
    visible:
      id: account-profile-card
    timeout: 8000
    optional: true
- runFlow:
    when:
      notVisible:
        id: account-profile-card
    commands:
      - tapOn:
          point: "31%,63%"
- extendedWaitUntil:
    visible:
      id: account-profile-card
    timeout: 10000
