# App neuve, cookies acceptés : point de départ des parcours qui ne testent pas le bandeau.
appId: io.bullify.nutrion-app
---
- runFlow: launch-fresh.yaml
- tapOn:
    id: consent-accept
- assertNotVisible:
    id: consent-accept
# Le bandeau se retire : un toucher pendant ce temps pouvait se perdre (onglet resté sur Boutique).
- waitForAnimationToEnd:
    timeout: 3000
