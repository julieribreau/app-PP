# App neuve : données et trousseau effacés (session, panier invité, consentement).
appId: io.bullify.nutrion-app
---
- clearKeychain
- launchApp:
    clearState: true
    permissions:
      photos: allow
# Une confirmation « Ouvrir dans NutrionApp ? » restée d'un lien précédent masque l'app.
- runFlow:
    when:
      visible: "Open in “NutrionApp”\\?|Ouvrir dans « NutrionApp » \\?"
    commands:
      - tapOn: "Cancel|Annuler"
- extendedWaitUntil:
    visible:
      id: consent-accept
    timeout: 30000
