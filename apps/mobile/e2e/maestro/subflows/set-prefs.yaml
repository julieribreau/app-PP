# Langue LOCALE (fr | en) et thème THEME (light | dark | system) par l'écran Préférences.
appId: io.bullify.nutrion-app
---
- tapOn:
    id: tab-account
    retryTapIfNoChange: true
- runFlow: { file: tap-low.yaml, env: { ID: account-theme } }
- tapOn:
    id: locale-${LOCALE}
- tapOn:
    id: theme-${THEME}
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element:
      id: account-theme
    direction: UP
