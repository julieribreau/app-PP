# Connexion par l'onglet Compte. Entrée : EMAIL, PASSWORD. Refuse l'offre Face ID si elle vient.
# « Suivant » passe au mot de passe (le clavier le recouvre), « Aller » envoie le formulaire.
appId: io.bullify.nutrion-app
---
- tapOn:
    id: tab-account
    retryTapIfNoChange: true
- tapOn:
    id: account-sign-in
- runFlow:
    file: fill-sign-in.yaml
    env:
      EMAIL: ${EMAIL}
      PASSWORD: ${PASSWORD}
# L'offre Face ID (si un visage est enrôlé) arrive avant la fermeture de la feuille.
- repeat:
    while:
      visible:
        id: sign-in-submit
    times: 10
    commands:
      - runFlow: after-sign-in.yaml
      - extendedWaitUntil:
          notVisible:
            id: sign-in-submit
          timeout: 2000
          optional: true
- runFlow: after-sign-in.yaml
- runFlow: dismiss-save-password.yaml
