# Production minimale : images publiées par .github/workflows/docker.yml sur GHCR.
# Sur l'hôte : ce fichier + un .env (cf .env.example, section « Déploiement »), puis
#   docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Le backend joue ses migrations à chaque démarrage. Stockage objet (S3) et e-mails (Brevo) :
# services externes, renseignés dans le .env.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  backend:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER manquant}/nutrion-backend:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://nutrion:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/nutrion
      REDIS_URL: redis://redis:6379
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped
    logging: *logging

  # Le web réécrit /api/* vers http://backend:3001 (BACKEND_URL figé au build de l'image).
  web:
    image: ghcr.io/${GHCR_OWNER}/nutrion-web:${IMAGE_TAG:-latest}
    ports: ["${WEB_PORT:-3000}:3000"]
    depends_on: [backend]
    restart: unless-stopped
    logging: *logging

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: nutrion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nutrion
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nutrion"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8
    volumes: [redis:/data]
    restart: unless-stopped
    logging: *logging

volumes:
  db:
  redis:
