# SonarQube Bullify (cf socle §SonarQube). Objectifs : 80 % de couverture,
# zéro bug, zéro vulnérabilité, notes A, duplication ≤ 3 %.
sonar.projectKey=bullify-nutrion-app
sonar.projectName=NutrionApp

# Sources ÉNUMÉRÉES, jamais `.` : le scanner descend dans node_modules avant
# d'appliquer les exclusions, et casse sur les liens morts de pnpm. Chaque app ou
# package ajouté au monorepo s'ajoute ici, ses sources et son lcov.
sonar.sources=apps/backend/src,apps/web/app,apps/web/src,apps/mobile/app,apps/mobile/src,packages/ui/src,packages/api-port/src,packages/ui-tokens/src,packages/i18n/src,packages/db/src,packages/db-schema/src,packages/sentry/src,packages/cmp/src,packages/analytics/src,apps/storybook-web/.storybook,apps/storybook-web/stories,apps/storybook-app/.storybook,apps/storybook-app/stories,apps/load-tests/helpers,apps/load-tests/scenarios,tools/storybook-visual/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/storybook-static/**,**/.turbo/**,**/*.tsbuildinfo,.claude/**,**/.claude/**
sonar.typescript.tsconfigPaths=tsconfig.base.json,apps/backend/tsconfig.json,apps/web/tsconfig.json,apps/mobile/tsconfig.json,packages/sentry/tsconfig.json,packages/cmp/tsconfig.json,packages/analytics/tsconfig.json,apps/storybook-web/tsconfig.json,apps/storybook-app/tsconfig.json,tools/storybook-visual/tsconfig.json

# Chemins relatifs à la racine : tools/sonar/normalize-lcov.mjs les réécrit et
# signale tout lcov présent sur disque mais absent de cette liste.
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/web/coverage/lcov.info,apps/mobile/coverage/lcov.info,apps/mobile/coverage-jest/lcov.info,packages/ui/coverage/lcov.info,packages/api-port/coverage/lcov.info,packages/i18n/coverage/lcov.info,packages/db/coverage/lcov.info,packages/db-schema/coverage/lcov.info,packages/sentry/coverage/lcov.info,packages/cmp/coverage/lcov.info,packages/analytics/coverage/lcov.info

sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.tsx,**/*.stories.ts,**/e2e/**,**/*.config.{ts,js,cjs,mjs},**/*.d.ts,**/migrations/**,apps/backend/src/seed/**,**/.storybook/**,apps/load-tests/**,tools/storybook-visual/**
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*.stories.tsx,**/*.stories.ts,apps/backend/src/seed/**
sonar.qualitygate.wait=false
